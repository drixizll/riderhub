<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>You're offline · RiderHub</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font: 16px/1.6 system-ui, sans-serif; }
        main { width: min(100%, 460px); padding: 40px; border: 1px solid #e2e8f0; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 20px 60px #0f172a12; }
        .mark { width: 56px; height: 56px; margin: auto; display: grid; place-items: center; border-radius: 16px; background: #4f46e5; color: white; font-size: 27px; font-weight: 800; }
        h1 { margin: 22px 0 8px; font-size: 26px; line-height: 1.2; }
        p { margin: 0; color: #64748b; }
        button { margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 12px; background: #4f46e5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">R</div>
        <h1>You're offline</h1>
        <p>RiderHub needs an internet connection for bookings, maps, and live trip updates. Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
